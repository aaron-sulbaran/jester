<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clip lab</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; max-width: 760px; background: #fff; color: #111; }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    p.sub { margin: 0 0 12px; color: #555; }
    progress { width: 100%; }
    #status { min-height: 1.4em; }
    canvas { display: block; width: 100%; height: auto; background: #000; }
    video { display: none; }
    #people { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    #people button[aria-pressed="true"] { font-weight: bold; outline: 2px solid #f5c542; }
    table { border-collapse: collapse; margin-top: 12px; }
    td { border: 1px solid #ccc; padding: 4px 8px; }
    .hidden { display: none; }
    .switch { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 8px 0; }
    .switch span { font-weight: 600; }
    .switch label { cursor: pointer; }
    h2 { font-size: 1.05rem; margin: 16px 0 4px; }
    #blind { max-width: 480px; background: #16161d; }
    #link-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
    #link-form input { flex: 1 1 260px; min-width: 0; padding: 4px 6px; }
  </style>
</head>
<body>
  <h1>Clip lab</h1>
  <p class="sub">Pick a video, choose a person, and check the skeleton and outline sit on them.</p>
  <input id="file" type="file" accept="video/*" />
  <form id="link-form" action="/link-lab.html" method="get">
    <label for="link">Or paste a link (YouTube, Shorts, TikTok, Reels):</label>
    <input id="link" name="link" type="text" required placeholder="https://www.youtube.com/shorts/..." autocomplete="off" />
    <button type="submit">Open in the link lab</button>
  </form>
  <progress id="progress" value="0" max="1"></progress>
  <p id="status">Pick a video to start.</p>

  <section id="choose" class="hidden">
    <canvas id="confirm" width="720" height="405"></canvas>
    <div id="people"></div>
  </section>

  <section id="play" class="hidden">
    <div class="switch" id="overlay-switch">
      <span>Over the clip:</span>
      <label><input type="radio" name="overlay" value="skeleton" /> Skeleton</label>
      <label><input type="radio" name="overlay" value="outline" /> Outline</label>
      <label><input type="radio" name="overlay" value="both" /> Both</label>
    </div>
    <canvas id="overlay" width="720" height="405"></canvas>

    <h2>What the player sees (blind mode)</h2>
    <div class="switch">
      <span>Show:</span>
      <label><input type="radio" name="look" value="outline" /> Outline</label>
      <label><input type="radio" name="look" value="stick" /> Stick figure</label>
    </div>
    <div class="switch">
      <span>Place:</span>
      <label><input type="radio" name="place" value="fit" /> Fit</label>
      <label><input type="radio" name="place" value="exact" /> Exact spot</label>
    </div>
    <canvas id="blind" width="480" height="360"></canvas>
  </section>

  <table id="facts"></table>

  <video id="video" playsinline muted></video>
  <script type="module" src="./src/clip-lab.ts"></script>
</body>
</html>
