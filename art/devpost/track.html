<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Devpost track banner</title>
<link rel="stylesheet" href="devpost.css" />
<style>
  /* 1600 by 300. One admission ticket per track: track.html?name=Entertainment&line=...
     Sponsor names go in the line as plain text, never as logos. No label above the name. */
  body { width: 1600px; height: 300px; }
  .sheet { left: 16px; right: 28px; top: 12px; bottom: 22px; }
  .w1 { left: 70px; top: 18px; rotate: -10deg; }
  .w2 { right: 330px; top: 14px; rotate: 7deg; }
  .ticket-wrap { position: absolute; left: 92px; right: 290px; top: 36px; height: 222px; rotate: -1deg; }
  .ticket { height: 100%; padding: 0 230px 0 64px; }
  .ticket .stub { right: 30px; width: 170px; background-size: 96px auto; }
  .ticket .stub b { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font: 400 20px/1 var(--type); }
  .words { display: grid; gap: 4px; min-width: 0; }
  .name { margin: 0; font: 400 104px/1 var(--sticker); padding: 2px 6px 12px; white-space: nowrap; }
  .line { font: 400 30px/1.2 var(--type); }
  .jester-sticker { left: 1262px; top: -58px; width: 338px; rotate: 3deg; }
</style>
</head>
<body>
<div class="sheet"><div class="kraft"></div></div>
<div class="ticket-wrap"><div class="ticket">
  <div class="words">
    <h1 class="name"><span data-letters="Entertainment" data-param="name"></span></h1>
    <span class="line" data-param="line">Our main track at HackPrinceton Fall 2026</span>
  </div>
  <i class="stub"><b>Admit one</b></i>
</div></div>
<i class="washi w-pink w1"></i><i class="washi w-dots w2"></i>
<img class="jester-sticker" src="../../app/public/look/jester/classic-still.webp" alt="" />
<script src="common.js"></script>
<script>
  // Long track names shrink until they fit the ticket.
  const name = document.querySelector(".name");
  const room = document.querySelector(".words").clientWidth;
  let size = 104;
  while (name.scrollWidth > room && size > 48) name.style.fontSize = `${(size -= 4)}px`;
  document.title = `Track: ${name.textContent}`;
</script>
</body>
</html>
